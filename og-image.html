<meta charset="utf-8">
<title>og</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap">
<style>
:root{
  --paper:#FFFFFF; --paper-2:#F9F9F9;
  --ink:#0F0F0F; --ink-2:#4A4A4A; --ink-3:#6B6B6B;
  --rule:#D8D8D8; --accent:#FDDA24; --accent-ink:#7A5C00;
}
*{box-sizing:border-box}
html,body{margin:0;background:#EFEFEF}
/* exactly the size Open Graph and summary_large_image want, so nothing is
   resampled or letterboxed by the platform */
.card{
  width:1200px;height:630px;background:var(--paper);color:var(--ink);
  font-family:"Inter","Helvetica Neue",Arial,sans-serif;
  padding:64px 72px 56px;display:flex;flex-direction:column;justify-content:space-between;
}
.top{display:flex;align-items:center;justify-content:space-between}
/* Stellar then USDT0, both marks rendered at the same 44px so neither
   brand reads as the junior partner. The USDT0 file carried 63% transparent
   padding, which would have shrunk it against the Stellar mark, so it is
   trimmed to its own ink first. */
.brand{display:flex;align-items:center;gap:20px}
.brand .mark{width:44px;height:44px;display:block}
.brand .word{font-weight:600;font-size:24px;letter-spacing:-.01em;color:var(--ink)}
.lockup{display:flex;align-items:center;gap:13px}
.lockup img.usdt0{height:44px;width:auto;display:block}
.sep{width:1px;height:34px;background:var(--rule)}
.eyebrow{
  font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:17px;
  letter-spacing:.17em;text-transform:uppercase;color:var(--ink-2);
}
/* the section markers from the page, all filled: this is the whole thing */
.dots{display:flex;gap:9px}
.dots i{width:15px;height:15px;background:var(--accent);border:1.5px solid var(--accent-ink)}

h1{
  font-weight:600;font-size:92px;line-height:1.03;letter-spacing:-.032em;
  margin:0 0 22px;max-width:15ch;
}
h1 em{font-style:normal;color:var(--accent-ink)}
p{margin:0;font-size:27px;line-height:1.42;color:var(--ink-2);max-width:44ch}

.foot{
  display:flex;align-items:baseline;justify-content:space-between;
  border-top:1px solid var(--rule);padding-top:20px;
  font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:18px;
  letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);
}
.foot b{font-weight:400;color:var(--ink-2)}
</style>

<div class="card">

  <div class="top">
    <span class="brand">
      <span class="lockup"><img class="mark" src="stellar-mark.png" alt="Stellar"><span class="word">Stellar</span></span>
      <span class="sep"></span>
      <span class="lockup"><img class="usdt0" src="usdt0-lockup.png" alt="USDT0"></span>
    </span>
    <span class="dots"><i></i><i></i><i></i><i></i><i></i></span>
  </div>

  <div>
    <h1>USDT0 on <em>Stellar Network</em></h1>
    <p>A guide to USDT0 on Stellar, and everything you need to get started.</p>
  </div>

  <div class="foot">
    <span><b>developers.stellar.org</b>/launch/usdt0</span>
    <span>Stellar Development Foundation</span>
  </div>

</div>
